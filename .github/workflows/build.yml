name: Build ECHO-7 (Linux & Windows)
on: [push, workflow_dispatch]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Build Linux Binary
        run: |
          pyinstaller -y --noconsole --onedir \
            --add-data "data:data" \
            --hidden-import "tools.check_runtime_assets" \
            --hidden-import "src.levels.level_loader" \
            --hidden-import "src.core.game" \
            --name "ECHO-7" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: ECHO-7-Linux
          path: dist/ECHO-7

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
        shell: pwsh
      - name: Build Windows Executable
        run: |
          pyinstaller -y --noconsole --onedir `
            --add-data "data;data" `
            --hidden-import "tools.check_runtime_assets" `
            --hidden-import "src.levels.level_loader" `
            --hidden-import "src.core.game" `
            --name "ECHO-7" main.py
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: ECHO-7-Windows
          path: dist/ECHO-7